name: Debug Windows browser flakes

# Temporary workflow to investigate Windows-only browser test flakes. Do not merge.

permissions: {}

on:
  pull_request:
    paths:
      - .github/workflows/debug-windows-browser.yml
      - test/browser/fixtures/clipboard-debug/**

concurrency:
  group: debug-windows-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
  PNPM_CONFIG_TRUST_LOCKFILE: true

jobs:
  clipboard:
    name: 'Clipboard: ${{ matrix.browsers }}, windows-latest'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # "firefox" runs only Firefox; "all" runs chromium, firefox and webkit in parallel like CI does
        browsers: [firefox, all]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-and-cache
        with:
          node-version: 24

      - name: Install
        run: pnpm i --filter '!docs'

      - uses: $/.github/actions/setup-playwright
        with:
          browsers: all

      - name: Build
        run: pnpm run build

      - name: Run clipboard fixture repeatedly
        shell: bash
        working-directory: test/browser
        env:
          BROWSERS: ${{ matrix.browsers }}
          ITERATIONS: 40
        run: |
          mkdir -p debug-logs
          if [ "$BROWSERS" = "firefox" ]; then export TEST_BROWSER=firefox; fi
          fail=0
          for i in $(seq 1 "$ITERATIONS"); do
            rm -rf fixtures/clipboard-debug/.vitest
            if pnpm exec vitest run --root fixtures/clipboard-debug --silent=false > "debug-logs/run-$i.log" 2>&1; then
              echo "run $i: pass"
            else
              fail=$((fail + 1))
              echo "run $i: FAIL"
              if [ -d fixtures/clipboard-debug/.vitest ]; then cp -r fixtures/clipboard-debug/.vitest "debug-logs/run-$i-attachments"; fi
              cat "debug-logs/run-$i.log"
            fi
          done
          echo "### clipboard ($BROWSERS): $fail / $ITERATIONS failed" >> "$GITHUB_STEP_SUMMARY"
          echo "$fail / $ITERATIONS failed"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: clipboard-debug-${{ matrix.browsers }}
          path: test/browser/debug-logs
          include-hidden-files: true
          retention-days: 3
