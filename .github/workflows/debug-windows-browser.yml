name: Debug Windows browser flakes

# Temporary workflow to investigate Windows-only browser test flakes. Do not merge.

permissions: {}

on:
  pull_request:
    paths:
      - .github/workflows/debug-windows-browser.yml
      - test/browser/fixtures/clipboard-debug/**

concurrency:
  group: debug-windows-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
  PNPM_CONFIG_TRUST_LOCKFILE: true

jobs:
  clipboard:
    name: 'Clipboard: ${{ matrix.mode }}, windows-latest'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # user-event: the whole user-event fixture with the instrumented clipboard test, all browsers
        # runner-spec: specs/runner.test.ts -t user-event, exactly what the CI "runner" job runs
        include:
          - mode: user-event
            iterations: 40
          - mode: runner-spec
            iterations: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-and-cache
        with:
          node-version: 24

      - name: Install
        run: pnpm i --filter '!docs'

      - uses: $/.github/actions/setup-playwright
        with:
          browsers: all

      - name: Build
        run: pnpm run build

      - name: Run clipboard fixture repeatedly
        shell: bash
        working-directory: test/browser
        env:
          MODE: ${{ matrix.mode }}
          ITERATIONS: ${{ matrix.iterations }}
        run: |
          mkdir -p debug-logs
          cp fixtures/clipboard-debug/clipboard.test.ts fixtures/user-event/clipboard.test.ts
          fail=0
          mismatch=0
          for i in $(seq 1 "$ITERATIONS"); do
            rm -rf fixtures/user-event/.vitest
            if [ "$MODE" = "runner-spec" ]; then
              cmd=(pnpm exec vitest --no-watch --config=vitest.config.unit.mts specs/runner.test.ts -t '^user-event$')
            else
              cmd=(pnpm exec vitest run --root fixtures/user-event --silent=false)
            fi
            if PROVIDER=playwright "${cmd[@]}" > "debug-logs/run-$i.log" 2>&1; then
              echo "run $i: pass"
            else
              fail=$((fail + 1))
              if grep -q "CLIPBOARD_DEBUG" "debug-logs/run-$i.log"; then
                mismatch=$((mismatch + 1))
                echo "run $i: FAIL (clipboard mismatch)"
              else
                echo "run $i: FAIL (other)"
              fi
              if [ -d fixtures/user-event/.vitest ]; then cp -r fixtures/user-event/.vitest "debug-logs/run-$i-attachments"; fi
              cat "debug-logs/run-$i.log"
            fi
          done
          echo "Focus state before the first click in passing runs:"
          grep -ho "CLIPBOARD_OK .*" debug-logs/*.log | sort | uniq -c || true
          echo "### clipboard ($MODE): $fail / $ITERATIONS failed, $mismatch clipboard mismatches" >> "$GITHUB_STEP_SUMMARY"
          echo "$fail / $ITERATIONS failed, $mismatch clipboard mismatches"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: clipboard-debug-${{ matrix.mode }}
          path: test/browser/debug-logs
          include-hidden-files: true
          retention-days: 3
