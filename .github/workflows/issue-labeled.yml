name: Issue Labeled

on:
  issues:
    types: [labeled]
  # zizmor: ignore[dangerous-triggers]
  # We don't use any information from the PR content itself except the login of the user.
  # The login is used only in the GitHub comment, not passed down as untrusted code.
  pull_request_target:
    types: [labeled]

permissions: {}

concurrency:
  # labels added together must not cancel each other
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  reproduction-reply-labeled:
    runs-on: ubuntu-slim
    if: github.repository == 'vitest-dev/vitest' && github.event.label.name == 'needs reproduction'
    name: Minimal Reproduction Label
    permissions:
      issues: write # adding a label
    steps:
      - name: needs reproduction
        uses: $/.github/actions/issues-helper
        with:
          actions: create-comment
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Hello @${{ github.event.issue.user.login }}. Please provide a [minimal reproduction](https://stackoverflow.com/help/minimal-reproducible-example) using a GitHub repository or [StackBlitz](https://vitest.new) (you can also use [examples](https://github.com/vitest-dev/vitest/tree/main/examples)). Issues marked with `needs reproduction` will be closed if they have no activity within 3 days.

  approved-comment:
    runs-on: ubuntu-slim
    if: github.repository == 'vitest-dev/vitest' && github.event.label.name == 'approved' && github.event_name == 'issues' && github.event.issue.state == 'open'
    name: Approved Label
    permissions:
      issues: write # sending a comment
    steps:
      - name: approved
        uses: $/.github/actions/issues-helper
        with:
          actions: create-comment
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            This issue is approved, so the team accepts a pull request for it. To work on it, open a pull request against `main` and link this issue in its description with a [closing keyword](https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue#linking-a-pull-request-to-an-issue-using-a-keyword), for example `Fixes #${{ github.event.issue.number }}`.

            The team accepts one pull request per issue: if another pull request for this issue is already open, a new one is closed automatically. See our [pull request policy](https://github.com/vitest-dev/vitest/blob/main/CONTRIBUTING.md#pull-request-policy) for more context.

  issue-clanker-comment:
    runs-on: ubuntu-slim
    if: github.repository == 'vitest-dev/vitest' && github.event.label.name == 'maybe automated' && github.event_name == 'issues'
    name: Comment on Bot Issue
    permissions:
      issues: write # sending a comment
    steps:
      - name: maybe automated
        uses: $/.github/actions/issues-helper
        with:
          actions: create-comment
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Hello @${{ github.event.issue.user.login }}. Your issue has been labeled `maybe automated` because it appears to have been fully generated by AI with no human involvement. It will be **closed automatically in 1 day** unless a real person responds.

            If you're a real person behind this contribution, please:
            - Confirm you've personally reviewed and stand behind its content
            - Make sure it follows our [contribution guidelines](https://github.com/vitest-dev/vitest/blob/main/CONTRIBUTING.md) and uses the correct [GitHub template](https://github.com/vitest-dev/vitest/blob/main/.github/ISSUE_TEMPLATE/bug_report.yml)
            - Disclose any AI tools you used (e.g. Claude, Copilot, Codex)

            If you believe this was flagged by mistake, leave a comment.

            *These measures help us reduce maintenance burden and keep the team's work efficient. See our [AI contribution policy](https://github.com/vitest-dev/vitest/blob/main/AI_POLICY.md) for more context.*

  pr-clanker-comment:
    runs-on: ubuntu-slim
    if: github.repository == 'vitest-dev/vitest' && github.event.label.name == 'maybe automated' && github.event_name == 'pull_request_target'
    name: Comment on Bot PR
    permissions:
      pull-requests: write # sending a comment
    steps:
      - uses: $/.github/actions/send-ai-bot-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          login: ${{ github.event.pull_request.user.login }}
