name: CI

# temporary workflow on the debug/firefox-crash branch: reproduce the Firefox
# "page crashed" flake of the browser tests, never merged
permissions: {}

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
  PNPM_CONFIG_TRUST_LOCKFILE: true

jobs:
  playwright-deps-image:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: 'Image: playwright-deps, ubuntu-latest'
    timeout-minutes: 15
    permissions:
      packages: write # push the playwright-deps image to GHCR
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image tag
        id: image
        run: |
          version="$(node -e "
            const fs = require('fs');
            const lockfile = fs.readFileSync('./pnpm-lock.yaml', 'utf8');
            const match = lockfile.match(/playwright:\s+specifier: [\s\w.^]+version: (\d+\.\d+\.\d+)/);
            if (!match) throw new Error('Failed to resolve playwright version');
            console.log(match[1]);
          ")"
          hash="$(sha256sum .github/docker/Dockerfile | cut -c1-12)"
          echo "image=ghcr.io/${GITHUB_REPOSITORY@L}/playwright-deps:${version}-${hash}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push if missing
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          PLAYWRIGHT_VERSION: ${{ steps.image.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE already exists, skipping build"
          else
            docker build --build-arg "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" -t "$IMAGE" .github/docker
            if ! docker push "$IMAGE"; then
              echo "::error::Failed to publish $IMAGE. Fork PRs cannot push to GHCR - a Vitest maintainer needs to run CI from a vitest-dev/vitest branch to publish the playwright-deps:$PLAYWRIGHT_VERSION image."
              exit 1
            fi
          fi

  debug-firefox:
    needs:
      - playwright-deps-image
    name: 'Firefox crash: playwright ${{ matrix.playwright }}, runner ${{ matrix.slot }}'
    runs-on: ubuntu-latest
    permissions:
      packages: read # pull the playwright-deps image from GHCR
    container:
      image: ${{ needs.playwright-deps-image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 1001
    strategy:
      matrix:
        playwright: [1.64.1, 1.63.0]
        slot: [1, 2, 3, 4, 5]
      fail-fast: false
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-and-cache
        with:
          node-version: 24

      - name: Switch playwright
        if: matrix.playwright != '1.64.1'
        env:
          PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
        run: |
          sed -i "s/^  '@playwright\/test': ^1.64.1$/  '@playwright\/test': $PLAYWRIGHT_VERSION/; s/^  playwright: ^1.64.1$/  playwright: $PLAYWRIGHT_VERSION/" pnpm-workspace.yaml
          sed -i "s/\"playwright\": \"^1.64.1\"/\"playwright\": \"$PLAYWRIGHT_VERSION\"/" examples/lit/package.json
          grep -n "playwright" pnpm-workspace.yaml examples/lit/package.json

      - name: Install
        run: pnpm i --filter '!docs' --no-frozen-lockfile

      - uses: $/.github/actions/setup-playwright
        with:
          browsers: all

      - name: Build
        run: pnpm run build

      - name: Generate fixtures
        run: node .github/gen-ff-fixtures.mjs 40

      - name: Run the fixture in a loop
        run: bash .github/debug-firefox-crash.sh user-event-hover 1000 2400

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: firefox-logs-${{ matrix.playwright }}-${{ matrix.slot }}
          path: /tmp/ff-logs
          if-no-files-found: ignore
