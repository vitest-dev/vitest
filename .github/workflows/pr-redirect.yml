name: PR Redirect

# Closes pull requests from the community and asks to discuss the change in an issue,
# see "Pull Request Policy" in CONTRIBUTING.md.
#
# SECURITY: this workflow must never check out or run code from a pull request.
# The script reads the pull request through the API and uses its content only as data.
# Do not interpolate PR titles, bodies, branch names or comments into `run` steps or scripts.

on:
  # zizmor: ignore[dangerous-triggers]
  # Only the script from the base branch runs, the pull request is used only as data.
  pull_request_target:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  redirect:
    if: github.repository == 'vitest-dev/vitest'
    name: Redirect Community PR
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # to check out the script and read the list of approved contributors
      issues: read # to read the issues linked to the PR
      pull-requests: write # to comment on and close the PR
    steps:
      # the PR can target any branch, the policy always comes from `main`
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          ref: main
      - name: Redirect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: redirectPullRequest } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-redirect.js`)
            await redirectPullRequest({ github, context, core })
